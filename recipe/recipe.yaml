schema_version: 1

context:
  name: nanoleafapi
  version: 2.1.2

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/nanoleafapi-${{ version }}.tar.gz
  sha256: cb8c5407197b4ab8bd79e5ee791020667579f0fbbe92009e9014587d74ea2a97

build:
  number: 2
  noarch: python
  script:
    # the effects-builder CLI is not available since it is not shipped with the package, see
    # https://github.com/MylesMor/nanoleafapi/blob/8d4fda3593f906c9e2e2dd980f8acacf51aa7392/setup.py#L24
    # https://github.com/MylesMor/nanoleafapi/blob/8d4fda3593f906c9e2e2dd980f8acacf51aa7392/.gitignore#L9
    - ${{ PYTHON }} -m pip install . -vv
    - if: unix
      then: rm $PREFIX/bin/effects-builder
    - if: win
      then: del %PREFIX%\\Scripts\\effects-builder.exe

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests
    - sseclient

tests:
  - python:
      imports:
        - nanoleafapi
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: A Python 3 wrapper for the Nanoleaf OpenAPI, for use when controlling the Light Panels, Canvas and Shapes (including Hexagons)
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/MylesMor/nanoleafapi

extra:
  recipe-maintainers:
    - pavelzw
